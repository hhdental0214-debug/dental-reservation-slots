name: Update reservation slots

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-slots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Adjust output path
        run: |
          sed -i 's#output_path = "/Users/hasegawa/Desktop/slots.json"#output_path = "slots.json"#' fetch_slots.py

      - name: Fetch reservation slots
        run: python fetch_slots.py

      - name: Save slots.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slots.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update reservation slots"
            git push
          fi
